{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<!--metadata aka links to other files or css stuff... title of the page etc...-->>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/blog.css'%}">
    <title>Django Blog</title>
</head>

<body>
 
    <hearder class="page-header">
        <div class="container">
            {% if user.is_authenticated %}
            <a button href="/logout" class="top-menu" style="background: none; border: node;">
                Logout
            </a>
            <a href="{% url 'post_new' %}" class="top-menu">
                {% include './icons/file-earmark-plus.svg' %}
            </a>
            <a href="{% url 'post_draft_list' %}" class="top-menu">
                Drafts
            </a>
        
            {% else %}
            
            <a href="{% url 'login' %}" class="top-menu">
                Login
            </a>
            {% endif %}
        
            <h1><a href="/">Django Girls Blog</a></h1>
         </div>
    </hearder>

    <main class="container">
        <div class="row">
            <div class="column">
                {% block content %}
                {% endblock %}
              
        </div>
    </main>
</body>
</html>
